
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>我的第一个网页</title>
</head>
<body>

    <h1>你好，欢迎来到我的个人主页！</h1>

    <h2 id="about">关于我</h2>
    <p>你好，我正在学习 HTML 和 AI 应用开发。</p>
    <p>这是我制作的第一个网页。</p>

    <h2>我的学习目标</h2>
    <ul>
        <li>掌握 HTML 网页开发</li>
        <li>学习 CSS 网页美化</li>
        <li>学习 JavaScript 编程</li>
        <li>开发属于自己的 AI 应用</li>
        <li>我爱点点</li>
    </ul>

    <h2>我的座右铭</h2>
    <p>每天进步一点点，坚持创造自己的作品！</p>
    <button class="button" id="greetButton">
    点击认识我
</button>

<p id="message">点击上面的按钮试试看！</p>
    

<h2>我的学习记录</h2>

<input
    type="text"
    id="studyInput"
    placeholder="请输入今天学到的内容"
>

<button id="addButton">添加记录</button>
<p>已经记录：<span id="recordCount">0</span> 条</p>
<ul id="studyList">
</ul>

<script src="script.js"></script>
</body>
</html>
